<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>llm-swarm-router — dashboard</title>
  <link rel="icon" href="logo-light.png" type="image/png" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="logo-dark.png" type="image/png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="logo-light.png" type="image/png" />
  <link rel="stylesheet" href="dashboard-tokens.css?v=0.5.0.1" />
  <link rel="stylesheet" href="dashboard.css?v=0.5.0.1" />
</head>
<body>
  <a class="skip-link" href="#page-main">Skip to content</a>
  <div class="app">
    <nav class="sidebar" aria-label="Dashboard navigation">
      <div class="sidebar-brand">
        <picture class="brand-logo">
          <source srcset="logo-dark.png" media="(prefers-color-scheme: dark)" />
          <img src="logo-light.png" alt="" width="32" height="32" />
        </picture>
        <div class="sidebar-brand-text">
          <strong>llm-swarm-router</strong>
          <span id="sidebar-version">Mesh router</span>
        </div>
      </div>

      <div class="nav-scroll">
        <div class="nav-group-label" id="nav-group-mesh">Mesh</div>
        <div class="nav-group" role="group" aria-labelledby="nav-group-mesh">
          <button type="button" class="nav-item active" data-page="overview" aria-current="page">
            <span class="nav-icon" aria-hidden="true">&#9678;</span>
            <span class="nav-label">Overview</span>
          </button>
          <button type="button" class="nav-item" data-page="backends">
            <span class="nav-icon" aria-hidden="true">&#9636;</span>
            <span class="nav-label">Backends</span>
            <span class="nav-count" id="nav-count-backends"></span>
          </button>
          <button type="button" class="nav-item" data-page="models">
            <span class="nav-icon" aria-hidden="true">&#9767;</span>
            <span class="nav-label">Models &amp; pools</span>
            <span class="nav-count" id="nav-count-models"></span>
          </button>
          <button type="button" class="nav-item" data-page="peers">
            <span class="nav-icon" aria-hidden="true">&#8286;</span>
            <span class="nav-label">Peers</span>
            <span class="nav-count" id="nav-count-peers"></span>
          </button>
        </div>

        <div class="nav-group-label" id="nav-group-config">Config</div>
        <div class="nav-group" role="group" aria-labelledby="nav-group-config">
          <button type="button" class="nav-item" data-page="network">
            <span class="nav-icon" aria-hidden="true">&#8779;</span>
            <span class="nav-label">Network</span>
          </button>
          <div class="nav-sublabel">Agent · Discovery · Swarm</div>
          <button type="button" class="nav-item" data-page="routing">
            <span class="nav-icon" aria-hidden="true">&#8706;</span>
            <span class="nav-label">Routing</span>
          </button>
          <button type="button" class="nav-item" data-page="cloud">
            <span class="nav-icon" aria-hidden="true">&#9729;</span>
            <span class="nav-label">Cloud failover</span>
            <span class="nav-dot" id="nav-dot-cloud" hidden></span>
          </button>
          <button type="button" class="nav-item" data-page="preferences">
            <span class="nav-icon" aria-hidden="true">&#9776;</span>
            <span class="nav-label">Preferences</span>
          </button>
        </div>

        <div class="nav-group-label" id="nav-group-tools">Tools</div>
        <div class="nav-group" role="group" aria-labelledby="nav-group-tools">
          <button type="button" class="nav-item" data-page="integrations">
            <span class="nav-icon" aria-hidden="true">&#8703;</span>
            <span class="nav-label">Integrations</span>
          </button>
          <button type="button" class="nav-item" data-page="logs">
            <span class="nav-icon" aria-hidden="true">&#9634;</span>
            <span class="nav-label">Logs</span>
          </button>
          <button type="button" class="nav-item" data-page="doctor">
            <span class="nav-icon" aria-hidden="true">&#10010;</span>
            <span class="nav-label">Doctor &amp; test</span>
            <span class="nav-dot" id="nav-dot-doctor" hidden></span>
          </button>
        </div>
      </div>

      <div class="endpoint-card">
        <div class="endpoint-label">Client endpoint</div>
        <div class="endpoint-url" id="client-endpoint">—</div>
        <div class="endpoint-actions">
          <button type="button" id="btn-env">Copy env</button>
          <button type="button" class="secondary" id="btn-snippets">Snippets</button>
        </div>
      </div>
    </nav>

    <div class="main">
      <header class="topbar">
        <div class="topbar-status">
          <span id="status-badge" class="pill warn"><span class="dot"></span>Checking…</span>
          <span id="agent-status-line" class="topbar-meta">Loading…</span>
        </div>
        <div class="topbar-actions">
          <button type="button" class="secondary" id="btn-discover">Discover</button>
          <a class="btn secondary" id="btn-status-json" href="/netllm/v1/status" target="_blank" rel="noopener">Status JSON</a>
          <a class="btn secondary" id="btn-omlx-admin" href="http://127.0.0.1:8080/admin" target="_blank" rel="noopener">oMLX Admin</a>
          <button type="button" class="secondary" id="btn-drain">Drain</button>
          <button type="button" class="secondary" id="btn-refresh">Refresh</button>
          <button type="button" id="btn-save" disabled>Save</button>
        </div>
      </header>

      <!-- setBanner() writes save results and "Could not reach the agent" here;
           without a live region none of it is announced. -->
      <div id="global-banner" role="status" aria-live="polite" hidden></div>

      <main class="content" id="page-main" tabindex="-1">
        <section id="page-overview" class="page active" aria-label="Overview"></section>
        <section id="page-backends" class="page" aria-label="Backends"></section>
        <section id="page-models" class="page" aria-label="Models and pools"></section>
        <section id="page-peers" class="page" aria-label="Peers"></section>
        <section id="page-network" class="page" aria-label="Network configuration"></section>
        <section id="page-routing" class="page" aria-label="Routing configuration"></section>
        <section id="page-cloud" class="page" aria-label="Cloud failover"></section>
        <section id="page-preferences" class="page" aria-label="Preferences"></section>
        <section id="page-integrations" class="page" aria-label="Integrations"></section>
        <section id="page-logs" class="page" aria-label="Agent logs"></section>
        <section id="page-doctor" class="page" aria-label="Doctor and test"></section>
      </main>
    </div>
  </div>

  <div id="sheet-host" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="dashboard.js?v=0.5.0.1"></script>
  <script src="schema-form.js?v=0.5.0.1"></script>
  <script src="pages/overview.js?v=0.5.0.1"></script>
  <script src="pages/backends.js?v=0.5.0.1"></script>
  <script src="pages/models.js?v=0.5.0.1"></script>
  <script src="pages/peers.js?v=0.5.0.1"></script>
  <script src="pages/network.js?v=0.5.0.1"></script>
  <script src="pages/routing.js?v=0.5.0.1"></script>
  <script src="pages/cloud.js?v=0.5.0.1"></script>
  <script src="pages/preferences.js?v=0.5.0.1"></script>
  <script src="pages/integrations.js?v=0.5.0.1"></script>
  <script src="pages/logs.js?v=0.5.0.1"></script>
  <script src="pages/doctor.js?v=0.5.0.1"></script>
  <script src="bootstrap.js?v=0.5.0.1"></script>
</body>
</html>
