# Generation 3 of the file above. The ONLY difference is that every
# [[routing.backends]] and [[routing.sources]] row now carries a `row_id`.
#
# Nothing else moved. Every unknown key, the unknown cloud provider and the
# deprecated key are still here, unchanged and in place, and no api_key or
# secret was touched -- a migration that tidied any of that would be a
# migration that deletes settings.
#
# What a reviewer should check by eye, since the digests themselves are
# opaque by construction:
#
#   * every row has exactly one row_id, and rows that had none all gained one
#   * the third backend keeps "b-already-minted" verbatim -- a config already
#     migrated elsewhere and copied here is never re-minted, which is what
#     makes the step idempotent
#   * the two backends sharing a base_url do NOT share an id: the second one
#     takes the "-2" suffix, so a legal-but-awkward config still ends up with
#     one identity per row
#   * backends are prefixed "b-", sources "s-"
#   * the id is derived from the row's OLD identity key (base_url / id), so
#     the same file migrated on a second machine produces the same ids

schema_version = 3

