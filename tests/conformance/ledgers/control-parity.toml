# Cross-surface control parity — the Axis D escape hatch.
#
# Three kinds of entry, all under the same discipline (`reason` + `expires`,
# asserted by tests/conformance/kit_config_surfaces.py):
#
#   [[control]]   a whole unit of control (a ControlDescriptor) absent on one
#                 surface — measured against PROGRAM.md §7's 20% tripwire
#   [[field]]     one config schema key with no control on one surface; the
#                 entry covers that key and everything nested beneath it
#   [[row_field]] a config row model field a client's typed struct does not
#                 carry (this used to be `INTENTIONALLY_ABSENT`, a dict
#                 literal in the kit — which could never carry an expiry
#                 because nothing read it)
#
# PROGRAM.md §7's tripwire, executable in
# `test_the_control_parity_ledger_is_under_the_tripwire`: if these entries
# ever cover >20% of (field, surface) pairs, the surfaces are wrong.
# Redesign them; do not add rows.

[scan]
