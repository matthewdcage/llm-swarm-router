# Registry-mirror ledger — consumed by scripts/check-registry-mirrors.py
# (docs/extending/PROGRAM.md §2, item 0a).
#
# The rule: a provider id is stated once, in its registry. Every other place
# the literal appears is a *mirror*, and every mirror that exists today is
# listed below with the phase that deletes it. The ledger is green on day one
# by construction; its power today is that a NEW id may not appear in a file
# that is not already listed here.
#
# Adding an entry is not a fix. If you are here because the gate failed, the
# question is whether the fact can be derived (runtime projection, generated
# artifact, or projection test) — see docs/extending/PROGRAM.md §1.

# Fixed scan list. Deliberately not a repo-wide walk: Phase 0 buys the
# detector, not the refactor. Doc rosters join in Phase 3 when they become
# generated; surface-name fact classes join in Phase 5a.
[scan]
# The phase this tree has completed. Any entry whose `expires` names this
# phase or an earlier one is overdue and fails the ledger test -- otherwise an
# expiry is decoration. (PROGRAM.md §5 phase order: 0,1,2,3,4,5a,5b,6,7,8.)
# Bumped 4 -> 5a in the Axis D phase. The prose above it used to argue for
# "phase-3" while the value read "phase-4", so the file disagreed with itself
# and `test_no_ledger_entry_is_overdue` was answering a question nobody had
# chosen. Both halves of Phase 4 have since landed
# (generate-registry-artifacts.py --check is in ci.sh:36, KeychainStore's
# switch cases are a generated block), and `39f0d5e` landed Phase 5a. 5b and
# 6 have not, so this stops at 5a. Every surviving entry expires at "never"
# with a stated reason or at "phase-8", so the bump lists nothing new as
# overdue -- it makes the clock honest rather than moving a deadline.
current_phase = "phase-5a"
files = [
  "packages/netllm-agent/src/netllm_agent/static/dashboard.js",
  "apps/netllm-mac/Sources/AppView/SettingsViewModel.swift",
  "apps/netllm-mac/Sources/Config/KeychainStore.swift",
  "apps/netllm-mac/Sources/Server/PythonRuntime.swift",
  "config.example.toml",
  "packages/netllm-cli/src/netllm_cli/ui.py",
  "packages/netllm-core/src/netllm_core/platform.py",
  "packages/netllm-discovery/src/netllm_discovery/local.py",
  "packages/netllm-core/src/netllm_core/models.py",
  "packages/netllm-agent/src/netllm_agent/admin.py",
]

[[fact_class]]
id = "cloud-provider-id"
source = "packages/netllm-core/src/netllm_core/cloud_providers.py"
# Ids are the keys of the CLOUD_PROVIDERS dict literal, read by AST so the
# checker needs no import and no installed environment.
extract = "dict-keys:CLOUD_PROVIDERS"

[[fact_class.allowed_mirrors]]
glob = "packages/netllm-agent/src/netllm_agent/static/dashboard.js"
reason = """cloud + local bootstrap lists, now GENERATED between markers by \
scripts/generate-registry-artifacts.py with --check in lint. They stay real \
literals so the dashboard renders offline, but they cannot drift"""
expires = "never — generated with --check"

[[fact_class.allowed_mirrors]]
glob = "apps/netllm-mac/Sources/AppView/SettingsViewModel.swift"
reason = """cloudProvidersBootstrap: the Settings offline roster. Carries \
display name, notes, regions and auth modes, not just ids, so it is \
projection-tested against the registry by kit_cloud rather than generated -- \
generating prose would be worse than checking it"""
expires = "never — offline fallback, projection-tested"

[[fact_class.allowed_mirrors]]
glob = "apps/netllm-mac/Sources/Config/KeychainStore.swift"
reason = """bootstrapProviderIDs, now GENERATED between markers with --check \
in lint. The accountForCloudProvider switch is gone: all six cases returned \
exactly what the default arm computes"""
expires = "never — generated with --check"

[[fact_class.allowed_mirrors]]
glob = "config.example.toml"
reason = """discovery.providers is generated between markers with --check. \
The [cloud.providers.*] example stanzas stay hand-written prose with \
per-provider commentary, which is documentation rather than a roster copy -- \
but their PRESENCE is now projection-tested by kit_cloud's \
test_config_example_documents_every_provider, and the stanza is a declared \
hand-written companion of the cloud worked example \
(tests/extending/test_worked_example_cloud.py). Phase 8 discharged the \
expiry by guarding presence without generating the prose"""
expires = "never — presence projection-tested, prose deliberately hand-written"

[[fact_class.allowed_mirrors]]
glob = "packages/netllm-core/src/netllm_core/models.py"
reason = """CloudProviderId re-export plus the openai/anthropic api_format \
Literal, which collides with two provider ids by coincidence of naming. Same \
rationale as ProviderId: a derived Literal blinds basedpyright, so it stays \
hand-written and is asserted by get_args equality in kit_cloud"""
expires = "never — hand-written Literal, get_args-asserted"

[[fact_class]]
id = "local-provider-id"
# Phase 3 moved the source of truth: `local.py`'s KNOWN_PROVIDERS is now a
# comprehension over this registry, not a literal, so it can no longer be the
# thing the checker reads. Eleven parallel maps collapsed into this one.
source = "packages/netllm-core/src/netllm_core/local_providers.py"
extract = "dict-keys:LOCAL_PROVIDERS"

[[fact_class.allowed_mirrors]]
glob = "packages/netllm-agent/src/netllm_agent/static/dashboard.js"
reason = """PROVIDERS_BOOTSTRAP: the degraded-mode roster rendered before \
GET /netllm/v1/local-providers returns, or when the agent is unreachable. \
No longer the source of truth (the fetch replaces it at boot) and pinned to \
the registry by kit_local. Kept because an offline dashboard still has to \
draw the discovery checkboxes"""
expires = "never — offline fallback, projection-tested"

[[fact_class.allowed_mirrors]]
glob = "apps/netllm-mac/Sources/AppView/SettingsViewModel.swift"
reason = """TWO separate hand-written rosters, pinned by DIFFERENT tests. \
localProviderBootstrap (labels + first scan port) is pinned by kit_local's \
test_swift_bootstrap_matches_the_registry; the `providers` roster (the \
Settings discovery checkbox loop) is pinned by \
tests/test_contract.py::test_swift_default_providers_match_python, NOT by \
kit_local -- this row claimed kit_local covered both until Phase 8b, and it \
never did. This is also the copy that had already drifted: vLLM was \
prefilled on LM Studio's port and labels came from .capitalized. Both are \
retained as the offline fallback, same contract as the cloud bootstrap next \
to it, and both are declared companions of the local worked example"""
expires = "never — offline fallback, projection-tested"

[[fact_class.allowed_mirrors]]
glob = "config.example.toml"
reason = """discovery.providers is GENERATED between markers with --check in \
lint; the provider_urls stanzas below it stay hand-written, being example \
URLs with commentary rather than a roster"""
expires = "never — generated with --check"

[[fact_class.allowed_mirrors]]
glob = "packages/netllm-core/src/netllm_core/models.py"
reason = """The ProviderId Literal, and nothing else: it is the ONLY \
hand-written local-provider fact in this file after Phase 3. A derived \
Literal blinds basedpyright, so it stays hand-written and is asserted by \
kit_local's get_args equality instead. This row used to also cite "the id -> \
*_API_KEY env map in Backend.resolve_api_key"; there is no such map -- \
resolve_api_key reads self.api_key_env off the Backend, which is populated \
from the registry spec, so no provider id appears in it"""
expires = "never — see reason"

[[fact_class.allowed_mirrors]]
glob = "packages/netllm-discovery/src/netllm_discovery/local.py"
reason = """oMLX's admin/telemetry probes test `provider != "omlx"`. NOT a \
roster mirror: oMLX exposes a proprietary admin API no other local server \
has, so the literal marks a genuine capability. kit_cloud pins that it stays \
the ONLY provider-specific branch in discovery -- a second one means the \
capability belongs on the spec instead"""
expires = "never — provider capability, single-branch-asserted"
