[project]
name = "netllm"
version = "0.5.0.1"
description = "Network LLM router — swarm agents with OpenAI-compatible gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "netllm-cli",
]

[project.scripts]
netllm = "netllm_cli.main:app"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netllm"]

[tool.uv.workspace]
members = [
    "packages/netllm-core",
    "packages/netllm-sdk-openai",
    "packages/netllm-sdk-anthropic",
    "packages/netllm-discovery",
    "packages/netllm-agent",
    "packages/netllm-cli",
]

[tool.uv.sources]
netllm-core = { workspace = true }
netllm-sdk-openai = { workspace = true }
netllm-sdk-anthropic = { workspace = true }
netllm-discovery = { workspace = true }
netllm-agent = { workspace = true }
netllm-cli = { workspace = true }

[dependency-groups]
dev = [
    "netllm-cli",
    "netllm-agent",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "basedpyright>=1.20",
    "httpx>=0.28",
    "venvstacks>=0.5",
    "pre-commit>=4.0",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# tests/contract/scenarios_*.py hold the contract-vector suites; without this
# they are silently uncollected and the corpus never runs.
python_files = ["test_*.py", "scenarios_*.py", "kit_*.py"]
testpaths = [
    "tests",
    "packages/netllm-sdk-openai/tests",
    "packages/netllm-sdk-anthropic/tests",
]

[tool.ruff]
line-length = 88
target-version = "py311"
# Local-maintainer-only coordinator files (gitignored, never on remote):
# ruff's gitignore respect proved racy run-to-run, flip-flopping the lint
# gate — exclude them explicitly so scripts/ci.sh is deterministic.
extend-exclude = [
    "tests/test_coordinator_dispatch.py",
    "tests/test_coordinator_engagement_monitor.py",
    "tests/fixtures/coordinator-snapshot",
    "tests/fixtures/coordinator-monitor",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
# Scope to first-party source. Without this it also walks .venv and
# packaging/_export (which contains a vendored CPython stdlib), producing
# ~26k findings that say nothing about this codebase.
include = ["packages", "tests", "scripts", "src"]
exclude = [
    "**/.venv",
    "**/node_modules",
    "**/__pycache__",
    "packaging/_build",
    "packaging/_export",
    "apps/netllm-mac/.build",
    "apps/netllm-mac/build",
]
