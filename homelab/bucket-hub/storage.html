<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Storage — Bucket-HUB</title>
  <style>
    :root {
      --bg: hsl(240 10% 8%);
      --panel: hsl(240 12% 11%);
      --border: hsl(240 8% 22%);
      --text: hsl(40 20% 92%);
      --muted: hsl(240 5% 62%);
      --accent: hsl(40 70% 55%);
      --danger: hsl(0 72% 52%);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, hsl(240 18% 14%), var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1rem;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: hsl(240 12% 9% / 0.92);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    header a.back {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
    }
    header a.back:hover { color: var(--accent); }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .tabs { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .tab {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .tab.active {
      color: var(--text);
      border-color: var(--accent);
      background: hsl(40 40% 20% / 0.35);
    }
    .tab:disabled { opacity: 0.4; cursor: not-allowed; }
    .actions { margin-left: auto; display: flex; gap: 0.5rem; align-items: center; }
    button.primary, button.ghost, button.danger {
      border-radius: 0.4rem;
      padding: 0.4rem 0.85rem;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid var(--border);
    }
    button.primary {
      background: hsl(40 55% 38%);
      color: #fff;
      border-color: hsl(40 55% 32%);
    }
    button.ghost { background: transparent; color: var(--text); }
    button.danger {
      background: hsl(0 50% 28%);
      color: #fff;
      border-color: var(--danger);
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .meta {
      padding: 0.5rem 1.25rem;
      color: var(--muted);
      font-size: 0.8rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
    }
    .crumb button {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      padding: 0;
      font-size: inherit;
    }
    .crumb span.sep { margin: 0 0.25rem; color: var(--muted); }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 1rem;
      padding: 0 1.25rem 0.75rem;
      min-height: 0;
    }
    @media (max-width: 960px) {
      main { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.55rem;
      overflow: hidden;
      min-height: 360px;
      display: flex;
      flex-direction: column;
    }
    .card h2 {
      margin: 0;
      padding: 0.65rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      flex-shrink: 0;
    }
    .viz-wrap {
      flex: 1;
      min-height: 420px;
      height: min(62vh, 560px);
      background: #0d0f14;
      position: relative;
    }
    gp-treemap {
      display: flex;
      width: 100%;
      height: 100%;
      --gp-bg: #0d0f14;
      --gp-fg: #e8e6e3;
      --gp-surface: #1a1d24;
      --gp-border: #2a2e38;
      --gp-selected: #f0c14a;
    }
    #list {
      flex: 1;
      max-height: min(62vh, 560px);
      overflow: auto;
    }
    #list table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    #list th, #list td {
      padding: 0.45rem 0.75rem;
      border-bottom: 1px solid hsl(240 8% 16%);
      text-align: left;
    }
    #list th {
      position: sticky;
      top: 0;
      background: var(--panel);
      color: var(--muted);
      font-weight: 500;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    #list tr.row { cursor: pointer; }
    #list tr.row:hover { background: hsl(240 12% 14%); }
    #list tr.row.selected { background: hsl(40 30% 16%); }
    #list .pct {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .sel-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      padding: 0.65rem 1.25rem 0.85rem;
    }
    .sel-bar .path {
      flex: 1;
      min-width: 12rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      color: var(--muted);
      word-break: break-all;
    }
    .attrib {
      padding: 0 1.25rem 1rem;
      font-size: 0.7rem;
      color: var(--muted);
    }
    .attrib a { color: var(--accent); }
    dialog {
      border: 1px solid var(--border);
      border-radius: 0.55rem;
      background: var(--panel);
      color: var(--text);
      padding: 1.1rem 1.25rem;
      max-width: 32rem;
      width: calc(100% - 2rem);
    }
    dialog::backdrop { background: hsl(240 10% 4% / 0.72); }
    dialog h3 { margin: 0 0 0.5rem; font-size: 1rem; }
    dialog p { margin: 0.35rem 0; color: var(--muted); font-size: 0.9rem; }
    dialog .dlg-path {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 0.78rem;
      color: var(--text);
      word-break: break-all;
      margin: 0.75rem 0;
      padding: 0.5rem;
      background: hsl(240 14% 7%);
      border-radius: 0.35rem;
    }
    dialog .dlg-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
    label.field { display: block; margin: 0.65rem 0 0.25rem; font-size: 0.8rem; color: var(--muted); }
    select {
      width: 100%;
      padding: 0.4rem;
      border-radius: 0.35rem;
      border: 1px solid var(--border);
      background: hsl(240 14% 7%);
      color: var(--text);
    }
    .msg { color: var(--accent); }
    .msg.err { color: hsl(0 70% 65%); }
  </style>
</head>
<body>
  <header>
    <a class="back" href="/">← Hub</a>
    <h1>Storage</h1>
    <div class="tabs" id="volumeTabs"></div>
    <div class="actions">
      <button type="button" class="primary" id="btnRefresh">Refresh scan</button>
    </div>
  </header>
  <div class="meta">
    <div class="crumb" id="crumb"></div>
    <span id="scanMeta">—</span>
    <span id="statusMsg" class="msg"></span>
  </div>
  <main>
    <section class="card">
      <h2>Visualiser</h2>
      <div class="viz-wrap" id="vizWrap">
        <gp-treemap id="tm"
          theme="tokyo-night"
          color-mode="categorical"
          palette="gp-default"
          value-format="b"
          show-labels="true"
          show-ancestors="true"
          gradient-intensity="0.55"
          min-cell-area="40"
          toolbar="true"
          tooltip="true"></gp-treemap>
      </div>
    </section>
    <section class="card">
      <h2>Contents</h2>
      <div id="list"></div>
    </section>
  </main>
  <div class="sel-bar">
    <div class="path" id="selPath">Select a folder or file</div>
    <button type="button" class="ghost" id="btnCopy" disabled>Copy…</button>
    <button type="button" class="danger" id="btnDelete" disabled>Delete…</button>
  </div>
  <p class="attrib">
    Treemap:
    <a href="https://github.com/imbue-ai/gp-treemap" target="_blank" rel="noopener">gp-treemap</a>
    (GrandPerspective lineage — Erwin Bonsma; GPL-2).
  </p>

  <dialog id="dlgDelete">
    <h3>Delete permanently?</h3>
    <p>This cannot be undone. Confirm the path below.</p>
    <div class="dlg-path" id="dlgDeletePath"></div>
    <p id="dlgDeleteSize"></p>
    <div class="dlg-actions">
      <button type="button" class="ghost" id="dlgDeleteCancel">Cancel</button>
      <button type="button" class="danger" id="dlgDeleteOk">Delete forever</button>
    </div>
  </dialog>

  <dialog id="dlgCopy">
    <h3>Copy to library folder</h3>
    <p>Creates a Hub sync (rsync) job. No VPN required.</p>
    <div class="dlg-path" id="dlgCopyPath"></div>
    <label class="field" for="copyDrive">Destination drive</label>
    <select id="copyDrive"></select>
    <label class="field" for="copyFolder">Folder</label>
    <select id="copyFolder"></select>
    <div class="dlg-actions">
      <button type="button" class="ghost" id="dlgCopyCancel">Cancel</button>
      <button type="button" class="primary" id="dlgCopyOk">Queue copy</button>
    </div>
  </dialog>

  <script src="/hub-form/vendor/gp-treemap.bundle.js"></script>
  <script>
(function () {
  const API = "/hub-form/api";
  const VOLUMES = [
    { id: "media", label: "Media" },
    { id: "usb", label: "USB" },
    { id: "tnas", label: "TNAS" },
  ];

  let volumeId = "media";
  let volumesMeta = {};
  let treeRoot = null;
  let currentNode = null;
  let selected = null;
  let nodeById = {};
  let library = null;
  let pollTimer = null;

  const $ = (id) => document.getElementById(id);
  const tm = () => document.getElementById("tm");

  function fmtBytes(n) {
    const x = Number(n) || 0;
    if (x < 1024) return x + " B";
    const u = ["KB", "MB", "GB", "TB"];
    let v = x / 1024, i = 0;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return v.toFixed(v >= 10 || i === 0 ? 0 : 1) + " " + u[i];
  }

  function setMsg(text, err) {
    const el = $("statusMsg");
    el.textContent = text || "";
    el.className = "msg" + (err ? " err" : "");
  }

  async function api(path, opts) {
    const r = await fetch(API + path, {
      cache: "no-store",
      headers: { "Content-Type": "application/json", ...(opts && opts.headers) },
      ...opts,
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.detail || data.error || String(r.status));
    return data;
  }

  function colorKey(node) {
    if (node.type === "dir") return "dir";
    if (node.type === "other") return "other";
    const name = node.name || "";
    const i = name.lastIndexOf(".");
    if (i <= 0) return "file";
    return name.slice(i + 1).toLowerCase().slice(0, 12) || "file";
  }

  /**
   * Flatten Hub tree for gp-treemap tabular API.
   * Parent dirs get value 0 so the library aggregates children — labels show true bytes.
   * Leaf files / truncated dirs keep their real size.
   */
  function flattenForGp(root) {
    const labels = [];
    const parents = [];
    const values = [];
    const ids = [];
    const color = [];
    const byId = {};

    function walk(node, parentId) {
      const id = node.path || (parentId ? parentId + "/" + node.name : node.name || "root");
      byId[id] = node;
      labels.push(node.name || id);
      parents.push(parentId || "");
      ids.push(id);
      color.push(colorKey(node));
      const kids = node.children || [];
      const isLeaf =
        node.type === "file" ||
        node.type === "other" ||
        node.truncated ||
        !kids.length;
      values.push(isLeaf ? Number(node.size) || 0 : 0);
      if (!isLeaf) {
        kids.forEach((c) => walk(c, id));
      }
    }
    walk(root, "");
    return { labels, parents, values, ids, color, byId };
  }

  function feedTreemap(root) {
    const el = tm();
    if (!el || !root) {
      if (el) {
        el.labels = [];
        el.parents = [];
        el.values = [];
        el.ids = [];
      }
      return;
    }
    const flat = flattenForGp(root);
    nodeById = flat.byId;
    el.colorMap = {
      dir: "hsl(210,45%,48%)",
      file: "hsl(40,55%,48%)",
      other: "hsl(0,0%,40%)",
      jpg: "hsl(300,45%,50%)",
      png: "hsl(260,50%,55%)",
      mp4: "hsl(348,55%,48%)",
      mkv: "hsl(348,55%,42%)",
      zip: "hsl(20,50%,45%)",
      json: "hsl(48,70%,48%)",
      txt: "hsl(180,30%,45%)",
    };
    el.labels = flat.labels;
    el.parents = flat.parents;
    el.values = flat.values;
    el.ids = flat.ids;
    el.color = flat.color;
    el.valueFormat = "b";
    el.showLabels = true;
  }

  function renderTabs() {
    const wrap = $("volumeTabs");
    wrap.innerHTML = "";
    VOLUMES.forEach((v) => {
      const meta = volumesMeta[v.id] || {};
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tab" + (v.id === volumeId ? " active" : "");
      btn.textContent = v.label + (meta.mounted === false ? " (off)" : "");
      btn.disabled = meta.mounted === false;
      btn.onclick = () => {
        volumeId = v.id;
        selected = null;
        loadTree();
        renderTabs();
      };
      wrap.appendChild(btn);
    });
  }

  function renderCrumb() {
    const el = $("crumb");
    el.innerHTML = "";
    if (!treeRoot || !currentNode) return;
    const chain = [];
    let n = currentNode;
    const byPath = {};
    function index(node, parent) {
      byPath[node.path] = { node, parent };
      (node.children || []).forEach((c) => index(c, node));
    }
    index(treeRoot, null);
    while (n) {
      chain.unshift(n);
      n = (byPath[n.path] && byPath[n.path].parent) || null;
    }
    chain.forEach((node, i) => {
      if (i) {
        const sep = document.createElement("span");
        sep.className = "sep";
        sep.textContent = "/";
        el.appendChild(sep);
      }
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = i === 0 ? (volumesMeta[volumeId]?.label || volumeId) : (node.name || "/");
      b.onclick = () => {
        currentNode = node;
        selected = null;
        const map = tm();
        if (map && typeof map.zoomTo === "function") {
          if (i === 0) map.zoomReset();
          else map.zoomTo(node.path);
        }
        renderList();
        updateSelectionBar();
        renderCrumb();
      };
      el.appendChild(b);
    });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderList() {
    const host = $("list");
    if (!currentNode) {
      host.innerHTML = "<p style='padding:1rem;color:var(--muted)'>No data — run Refresh scan.</p>";
      return;
    }
    const kids = (currentNode.children || []).slice().sort((a, b) => b.size - a.size);
    const parentSize = currentNode.size || 1;
    let html = "<table><thead><tr><th>Name</th><th>Size</th><th>%</th></tr></thead><tbody>";
    kids.forEach((c) => {
      const sel = selected && selected.path === c.path ? " selected" : "";
      const pct = ((c.size / parentSize) * 100).toFixed(1);
      const icon = c.type === "dir" ? "📁 " : "📄 ";
      html += `<tr class="row${sel}" data-path="${encodeURIComponent(c.path)}">
        <td>${icon}${escapeHtml(c.name)}</td>
        <td>${fmtBytes(c.size)}</td>
        <td class="pct">${pct}%</td></tr>`;
    });
    html += "</tbody></table>";
    host.innerHTML = html;
    host.querySelectorAll("tr.row").forEach((tr) => {
      tr.addEventListener("click", () => {
        const path = decodeURIComponent(tr.getAttribute("data-path") || "");
        const node = (currentNode.children || []).find((c) => c.path === path);
        if (!node) return;
        selected = node;
        const map = tm();
        if (node.type === "dir" && (node.children || []).length) {
          currentNode = node;
          if (map && typeof map.zoomTo === "function") map.zoomTo(node.path);
        } else if (map && typeof map.locateNode === "function") {
          map.locateNode(node.path);
        }
        renderCrumb();
        renderList();
        updateSelectionBar();
      });
    });
  }

  function isVolumeRoot(path) {
    const roots = ["/mnt/media", "/mnt/tnas", "/mnt/external"];
    return roots.some((r) => path === r || path === r + "/");
  }

  function updateSelectionBar() {
    const node = selected || currentNode;
    const pathEl = $("selPath");
    const canAct = node && node.path && node.type !== "other" && !isVolumeRoot(node.path);
    pathEl.textContent = node && node.path
      ? node.path + " · " + fmtBytes(node.size)
      : "Select a folder or file";
    $("btnCopy").disabled = !canAct;
    $("btnDelete").disabled = !canAct;
  }

  function renderAll() {
    renderTabs();
    renderCrumb();
    feedTreemap(treeRoot);
    renderList();
    updateSelectionBar();
  }

  function onGpClick(ev) {
    const id = ev.detail && ev.detail.nodeId;
    if (id == null) return;
    const node = nodeById[id];
    if (!node) return;
    selected = node;
    if (node.type === "dir") {
      currentNode = node;
      renderCrumb();
      renderList();
    } else {
      // Keep list on parent folder
      renderList();
    }
    updateSelectionBar();
  }

  async function loadVolumes() {
    const data = await api("/storage/volumes");
    volumesMeta = {};
    (data.volumes || []).forEach((v) => { volumesMeta[v.id] = v; });
    renderTabs();
  }

  async function loadTree() {
    setMsg("Loading…");
    try {
      const data = await api("/storage/tree?volume=" + encodeURIComponent(volumeId));
      treeRoot = data.tree || null;
      currentNode = treeRoot;
      selected = null;
      const when = data.scanned_at ? new Date(data.scanned_at * 1000).toLocaleString() : "never";
      const st = data.scan_status || "idle";
      $("scanMeta").textContent =
        "Last scan: " + when + (st === "running" ? " · scanning…" : "") +
        (data.tree ? " · " + fmtBytes(data.tree.size) : "");
      setMsg(st === "running" ? "Scan in progress…" : "");
      renderAll();
      if (st === "running") schedulePoll();
    } catch (e) {
      setMsg(String(e.message || e), true);
      treeRoot = null;
      currentNode = null;
      renderAll();
    }
  }

  function schedulePoll() {
    if (pollTimer) clearTimeout(pollTimer);
    pollTimer = setTimeout(async () => {
      try {
        const st = await api("/storage/scan/status");
        if (st.status === "running") {
          setMsg("Scanning " + (st.volume || "") + "…");
          schedulePoll();
        } else {
          await loadTree();
        }
      } catch (_) {
        schedulePoll();
      }
    }, 2500);
  }

  $("btnRefresh").onclick = async () => {
    try {
      setMsg("Requesting scan…");
      await api("/storage/scan", {
        method: "POST",
        body: JSON.stringify({ volume: volumeId }),
      });
      schedulePoll();
    } catch (e) {
      setMsg(String(e.message || e), true);
    }
  };

  $("btnDelete").onclick = () => {
    const node = selected || currentNode;
    if (!node || !node.path) return;
    $("dlgDeletePath").textContent = node.path;
    $("dlgDeleteSize").textContent = "Size: " + fmtBytes(node.size);
    $("dlgDelete").showModal();
  };
  $("dlgDeleteCancel").onclick = () => $("dlgDelete").close();
  $("dlgDeleteOk").onclick = async () => {
    const path = $("dlgDeletePath").textContent;
    try {
      await api("/storage/delete", {
        method: "POST",
        body: JSON.stringify({ path }),
      });
      $("dlgDelete").close();
      setMsg("Delete queued");
      setTimeout(loadTree, 3000);
    } catch (e) {
      setMsg(String(e.message || e), true);
    }
  };

  async function ensureLibrary() {
    if (library) return library;
    library = await api("/library");
    return library;
  }

  function fillCopySelects() {
    const drives = (library && library.drives) || {};
    const driveSel = $("copyDrive");
    const folderSel = $("copyFolder");
    driveSel.innerHTML = "";
    Object.keys(drives).forEach((id) => {
      const d = drives[id];
      if (d.mounted === false) return;
      const opt = document.createElement("option");
      opt.value = id;
      opt.textContent = d.label || id;
      driveSel.appendChild(opt);
    });
    function fillFolders() {
      folderSel.innerHTML = "";
      const d = drives[driveSel.value];
      (d && d.folders || []).forEach((f) => {
        if (f.present === false) return;
        const opt = document.createElement("option");
        opt.value = f.id;
        opt.textContent = f.name || f.id;
        folderSel.appendChild(opt);
      });
    }
    driveSel.onchange = fillFolders;
    fillFolders();
  }

  $("btnCopy").onclick = async () => {
    const node = selected || currentNode;
    if (!node || !node.path) return;
    try {
      await ensureLibrary();
      fillCopySelects();
      $("dlgCopyPath").textContent = node.path;
      $("dlgCopy").showModal();
    } catch (e) {
      setMsg(String(e.message || e), true);
    }
  };
  $("dlgCopyCancel").onclick = () => $("dlgCopy").close();
  $("dlgCopyOk").onclick = async () => {
    try {
      await api("/storage/copy", {
        method: "POST",
        body: JSON.stringify({
          path: $("dlgCopyPath").textContent,
          dest_drive_id: $("copyDrive").value,
          dest_folder_id: $("copyFolder").value,
        }),
      });
      $("dlgCopy").close();
      setMsg("Copy job queued — see Hub Queue");
    } catch (e) {
      setMsg(String(e.message || e), true);
    }
  };

  document.addEventListener("gp-click", onGpClick);
  document.addEventListener("gp-focus", onGpClick);

  (async function init() {
    try {
      await loadVolumes();
      if (volumesMeta.media && volumesMeta.media.mounted === false) {
        const first = VOLUMES.find((v) => volumesMeta[v.id] && volumesMeta[v.id].mounted !== false);
        if (first) volumeId = first.id;
      }
      await loadTree();
    } catch (e) {
      setMsg(String(e.message || e), true);
    }
  })();
})();
  </script>
